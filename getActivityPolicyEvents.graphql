query GetActivityPolicyEvents($first: Int!, $after: String) {
  activityPolicyEvents(first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      policyName
      severity
      action
      detectedAt
      asset {
        id
        name
      }
      __typename
    }
  }
}
